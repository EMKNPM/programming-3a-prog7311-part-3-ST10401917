name: .NET Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Start API and Database Services
      run: |
        docker compose up -d
        echo "Waiting for services to spin up on port 8080..."
        sleep 15

    - name: Restore dependencies
      run: dotnet restore "PROG7311 POE.sln"

    - name: Build
      run: dotnet build "PROG7311 POE.sln" --no-restore

    - name: Run tests
      run: dotnet test "PROG7311 POE.sln" --no-build --verbosity normal

    - name: Stop Services
      if: always()
      run: docker compose down
