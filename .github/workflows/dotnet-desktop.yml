name: .NET Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore PROG7311_POE.sln

    - name: Build
      run: dotnet build PROG7311_POE.sln --no-restore

    - name: Run tests
      run: dotnet test PROG7311_POE.sln --no-build --verbosity normal
